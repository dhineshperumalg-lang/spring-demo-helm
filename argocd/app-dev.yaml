apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-demo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dhineshperumalg-lang/spring-demo-helm.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: spring-demo-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
